# Every pull request and every push to main: the same checks a change must pass before it is merged
# (CONTRIBUTING.md, "Before you open a pull request").
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  # (the tests in four parts at once: on a private repo the runners have two cores, and one ran them all in eight to
  # ten minutes)
  test:
    name: Tests (the pinned frames, part ${{ matrix.part }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # (the worlds the flights fly over, built once and kept: src/lib/engine/testing/surfaces.ts)
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/xenophon-surfaces
          # (each part flies over its own worlds, so each keeps its own)
          key: surfaces-${{ matrix.part }}-${{ hashFiles('src/lib/engine/world/**', 'src/lib/engine/galaxy/**', 'src/lib/engine/data/**', 'src/lib/engine/util/**') }}
      - run: npx vitest run --shard=${{ matrix.part }}/4
